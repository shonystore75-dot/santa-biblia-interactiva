<!doctype html>
<meta charset="utf-8">
<title>Generador de texturas del carrusel Explorar</title>
<!-- Las funciones de abajo son las que antes vivian en index.html (se movieron aqui
     sin cambios). Si el diseno de los rollos cambia, se editan aqui y se corre
     'node scripts/texturas/generar.js' para regenerar las imagenes de /texturas. -->
<pre id="salida"></pre>
<script>
  // ---------- Texturas generadas con ruido con semilla ----------
  function mulberry(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function crearRuido(semilla) {
    const r = mulberry(semilla), T = new Float32Array(65536);
    for (let i = 0; i < 65536; i++) T[i] = r();
    const v = (ix, iy) => T[((iy & 255) << 8) | (ix & 255)];
    function n(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      let fx = x - ix, fy = y - iy;
      fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
      const a = v(ix, iy), b = v(ix + 1, iy), c = v(ix, iy + 1), d = v(ix + 1, iy + 1);
      const arriba = a + (b - a) * fx;
      return arriba + ((c + (d - c) * fx) - arriba) * fy;
    }
    function fbm(x, y, oct) {
      let s = 0, a = 0.5, m = 0;
      for (let i = 0; i < oct; i++) { s += a * n(x, y); m += a; x *= 2.03; y *= 2.03; a *= 0.5; }
      return s / m;
    }
    return { n, fbm };
  }
  function crearLienzo(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
  }

  // Papiro: tiras con fibras, costuras, manchas de edad y el borde superior
  // e inferior rasgado (los puntos son los del diseño original de la tarjeta).
  // La luz de los costados va dentro de la textura para que no pinte nada
  // fuera del borde irregular.
  function texturaPapiro(semilla, ancho, alto) {
    const w = Math.round(ancho * 2), h = Math.round(alto * 2);
    const c = crearLienzo(w, h), g = c.getContext('2d');
    const img = g.createImageData(w, h), d = img.data;
    const N = crearRuido(semilla * 97 + 11), R = mulberry(semilla * 31 + 5);
    const tira = 84, tonos = [];
    for (let k = 0; k < 8; k++) tonos.push((R() - 0.5) * 0.12);
    const SUP = [[0, 2.5], [5.8, 1.8], [10.9, 4.1], [18, 0.4], [22.8, 3.6], [29.4, 1.4], [35.4, 0.8], [40.1, 0.7], [46.6, 1.4], [51.2, 3.5], [57.4, 0.9], [62.2, 2.5], [67.1, 2.8], [73.3, 1.7], [81.1, 2.4], [86.1, 0.5], [91.5, 0.4], [98.5, 1], [100, 2.9]];
    const INF = [[0, 3.2], [6.2, 0.8], [12, 2.2], [18.8, 0.4], [25.1, 2.9], [30.8, 3.3], [38.5, 2.5], [45.8, 3.7], [51.3, 1.5], [58.1, 3], [64.7, 2.6], [72.7, 2.5], [80.1, 2], [85.8, 3.6], [94.2, 4], [99.2, 2.1], [100, 3.2]];
    function poli(pts, x, desp, espejo) {
      let u = ((x / w + desp) % 1 + 1) % 1;
      if (espejo) u = 1 - u;
      u *= 100;
      for (let j = 1; j < pts.length; j++) {
        if (u <= pts[j][0]) {
          const a = pts[j - 1], b = pts[j], f = (u - a[0]) / (b[0] - a[0] || 1);
          return a[1] + (b[1] - a[1]) * f;
        }
      }
      return pts[pts.length - 1][1];
    }
    const ESC = 1.7, o1 = R() * 0.5, o2 = R() * 0.5, f1 = R() < 0.5, f2 = R() < 0.5;
    function borde(x, arriba) {
      const base = arriba ? poli(SUP, x, o1, f1) : poli(INF, x, o2, f2);
      const q = N.n(x * 0.03 + (arriba ? 0 : 50), 20 + semilla);
      return 4 + base * h * 0.01 * ESC + 4 * N.fbm(x * 0.06 + semilla + (arriba ? 0 : 9), 7.7, 3) + (q > 0.82 ? 9 * (q - 0.82) / 0.18 : 0);
    }
    const yt = new Float32Array(w), yb = new Float32Array(w);
    for (let x = 0; x < w; x++) { yt[x] = borde(x, true); yb[x] = h - borde(x, false); }
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const jit = (N.n(x * 0.33, y * 0.33) - 0.5) * 4 + (N.n(x * 1.1, y * 1.1) - 0.5) * 1.6;
        const dist = Math.min(y - yt[x], yb[x] - y) + jit;
        const i = (y * w + x) * 4;
        if (dist < -2) { d[i + 3] = 0; continue; }
        const fib = N.fbm(x * 0.010, y * 0.55, 3), fino = N.n(x * 0.9, y * 0.22), grande = N.fbm(x * 0.008 + 7, y * 0.01 + 3, 3);
        const vert = N.fbm(x * 0.55 + 40, y * 0.014, 3);
        const kk = Math.floor(x / tira), sx = x - kk * tira;
        let t = 0.34 + grande * 0.6 + (fib - 0.5) * 0.46 + (vert - 0.5) * 0.2 + tonos[kk % 8] + (fino - 0.5) * 0.12;
        if (sx < 2) t -= 0.16 * (1 - sx / 2); else if (sx < 5) t += 0.04;
        t = t < 0 ? 0 : t > 1 ? 1 : t;
        let rr = 246 - 44 * t, gg = 226 - 64 * t, bb = 176 - 82 * t;
        let e = 1 - dist / 40; e = e < 0 ? 0 : e; e *= e;
        rr = rr * (1 - 0.3 * e) - 18 * e; gg = gg * (1 - 0.46 * e) - 14 * e; bb = bb * (1 - 0.66 * e) - 8 * e;
        if (dist < 6) { const q2 = (6 - dist) / 8; rr *= 1 - 0.34 * q2; gg *= 1 - 0.46 * q2; bb *= 1 - 0.55 * q2; }
        d[i] = rr; d[i + 1] = gg; d[i + 2] = bb;
        const al = (dist + 2) / 5;
        d[i + 3] = (al > 1 ? 1 : al) * 255;
      }
    }
    g.putImageData(img, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    for (let m = 0; m < 6; m++) {
      const px = R() * w, py = R() * h, rad = 40 + R() * 60, gr = g.createRadialGradient(px, py, 0, px, py, rad);
      gr.addColorStop(0, `rgba(120,78,32,${0.1 + R() * 0.12})`); gr.addColorStop(1, 'rgba(120,78,32,0)');
      g.fillStyle = gr; g.fillRect(px - rad, py - rad, rad * 2, rad * 2);
    }
    for (let m = 0; m < 2; m++) {
      const ax = 60 + R() * (w - 120), ay = 60 + R() * (h - 120), ar = 24 + R() * 22;
      g.beginPath(); g.arc(ax, ay, ar, 0, 7); g.fillStyle = 'rgba(150,105,50,.07)'; g.fill();
      g.lineWidth = 2.5; g.strokeStyle = 'rgba(105,66,28,.22)'; g.stroke();
    }
    for (let m = 0; m < 110; m++) { g.fillStyle = `rgba(70,40,15,${0.25 + R() * 0.4})`; const sz = 1 + R() * 1.6; g.fillRect(R() * w, R() * h, sz, sz); }
    const luz = g.createLinearGradient(0, 0, w, 0);
    luz.addColorStop(0, 'rgba(50,28,10,.5)'); luz.addColorStop(0.09, 'rgba(50,28,10,.14)'); luz.addColorStop(0.22, 'rgba(50,28,10,0)');
    luz.addColorStop(0.78, 'rgba(50,28,10,0)'); luz.addColorStop(0.91, 'rgba(50,28,10,.14)'); luz.addColorStop(1, 'rgba(50,28,10,.5)');
    g.fillStyle = luz; g.fillRect(0, 0, w, h);
    return c.toDataURL('image/png');
  }

  // Vara de madera caramelo torneada: remates redondos, anillos de bronce,
  // veta de madera envuelta en el cilindro y luz desde la izquierda.
  function texturaVara(alto) {
    const S = 3, cw = 30 * S, ch = Math.round(alto * S), c = crearLienzo(cw, ch), g = c.getContext('2d');
    const img = g.createImageData(cw, ch), d = img.data, N = crearRuido(97 * 53 + 7), cx = cw / 2;
    const oscuro = [150, 96, 44], claro = [216, 162, 90];
    function perfil(y) {
      const e = Math.min(y, alto - y);
      let r = 0, metal = false;
      if (e < 13) r = Math.sqrt(Math.max(0, 42.25 - (e - 6.5) * (e - 6.5))) * 1.45;
      else if (e < 16) r = 4.6;
      else if (e < 19) r = 7 + (e - 16) * 0.2;
      else if (e < 23) { r = 8.4 - Math.pow((e - 21) / 2, 2) * 0.9; metal = true; }
      else if (e < 26) r = 6.4 + (e - 23) * 0.3;
      else r = 7.3 + 0.35 * Math.sin(e * 0.18);
      return { r, metal };
    }
    let Lx = -0.5, Ly = -0.3, Lz = 0.81;
    const ll = Math.sqrt(Lx * Lx + Ly * Ly + Lz * Lz); Lx /= ll; Ly /= ll; Lz /= ll;
    let Hx = Lx, Hy = Ly, Hz = Lz + 1;
    const hl = Math.sqrt(Hx * Hx + Hy * Hy + Hz * Hz); Hx /= hl; Hy /= hl; Hz /= hl;
    for (let py = 0; py < ch; py++) {
      const y = py / S, p0 = perfil(y), pendiente = perfil(y + 0.5).r - perfil(y - 0.5).r, R = p0.r * S;
      for (let px = 0; px < cw; px++) {
        const dx = px + 0.5 - cx, i = (py * cw + px) * 4;
        if (R <= 0.5 || Math.abs(dx) > R + 1) { d[i + 3] = 0; continue; }
        const cov = Math.min(1, Math.max(0, R - Math.abs(dx) + 0.5));
        let nx = Math.max(-1, Math.min(1, dx / R)), nz = Math.sqrt(1 - nx * nx), ny = -pendiente * nz * 1.1;
        const nl = Math.sqrt(nx * nx + ny * ny + nz * nz); nx /= nl; ny /= nl; nz /= nl;
        const dif = Math.max(0, nx * Lx + ny * Ly + nz * Lz), lit = 0.34 + 0.8 * dif;
        let esp = Math.pow(Math.max(0, nx * Hx + ny * Hy + nz * Hz), p0.metal ? 34 : 22);
        const ue = nx * R;
        let cr, cg, cb;
        if (!p0.metal) {
          const gr = N.fbm(ue * 0.07, py * 0.009, 4), anillo = 0.5 + 0.5 * Math.sin(ue * 0.3 + N.fbm(ue * 0.03, py * 0.012, 3) * 7), poro = N.n(ue * 0.9, py * 0.05);
          const t = Math.max(0, Math.min(1, 0.42 * gr + 0.4 * anillo + 0.22 * poro - 0.06));
          cr = oscuro[0] + (claro[0] - oscuro[0]) * t; cg = oscuro[1] + (claro[1] - oscuro[1]) * t; cb = oscuro[2] + (claro[2] - oscuro[2]) * t;
          esp *= 0.16;
        } else {
          const cepillo = N.n(ue * 0.2, py * 1.4);
          cr = 168 + 40 * cepillo; cg = 122 + 34 * cepillo; cb = 52 + 22 * cepillo; esp *= 1.3;
        }
        d[i] = Math.min(255, cr * lit + 255 * esp * 0.85); d[i + 1] = Math.min(255, cg * lit + 245 * esp * 0.85); d[i + 2] = Math.min(255, cb * lit + 225 * esp * 0.85); d[i + 3] = cov * 255;
      }
    }
    g.putImageData(img, 0, 0);
    return c.toDataURL('image/png');
  }


// Tamano maximo que el carrusel puede mostrar (CSS px): hoja = 380-28 de ancho,
// 280-28 de alto; vara = alto + 20. texturaPapiro ya multiplica por 2 y texturaVara por 3.
const ANCHO_HOJA = 352, ALTO_HOJA = 252, N_PAPIROS = 3;
const salida = {};
for (let s = 1; s <= N_PAPIROS; s++) salida['papiro-' + s] = texturaPapiro(s, ANCHO_HOJA, ALTO_HOJA);
salida['vara'] = texturaVara(ALTO_HOJA + 20);
document.getElementById('salida').textContent = JSON.stringify(salida);
document.title = 'listo';
</script>
