<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favoritos · Santa Biblia 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400&display=swap');

  :root {
    --ciruela: #3D1F3E;
    --naranja: #D9622F;
    --dorado: #F5B942;
    --dorado-brillante: #FFDD8A;
    --papiro: #FBF0D9;
    --tinta: #3D2419;
    --terracota: #B9502E;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    background: #2A1A2E;
    font-family: 'Source Serif 4', serif;
    color: var(--tinta);
    display: flex;
    justify-content: center;
  }

  .phone {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    height: 100dvh;
    background: var(--papiro);
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  @media (min-width: 500px) {
    html, body { height: auto; }
    body { padding: 24px 0; }
    .phone {
      height: 760px;
      border-radius: 30px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 0 3px var(--tinta);
    }
  }

  header {
    flex: 0 0 auto;
    background: linear-gradient(135deg, var(--ciruela) 0%, #5A2A4A 100%);
    padding: 2.2vh 5vw 1.6vh;
    display: flex;
    align-items: center;
    gap: 3vw;
    border-bottom: 2px solid var(--dorado);
  }

  .btn-atras {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,221,138,0.4);
    color: var(--dorado-brillante);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
  }

  .btn-atras svg {
    width: 20px;
    height: 20px;
  }

  #titulo-header {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    color: #fff;
    font-size: clamp(15px, 3vh, 19px);
    flex: 1;
  }

  #subtitulo-header {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--dorado-brillante);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  main {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 2vh 5vw 3vh;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: rgba(185,80,46,0.65) rgba(185,80,46,0.08);
  }
  main::-webkit-scrollbar { width: 6px; }
  main::-webkit-scrollbar-track { background: rgba(185,80,46,0.08); }
  main::-webkit-scrollbar-thumb { background: rgba(185,80,46,0.65); border-radius: 4px; }
  main::-webkit-scrollbar-thumb:hover { background: rgba(185,80,46,0.85); }

  .cargando, .vacio {
    text-align: center;
    padding: 4vh 4vw;
    color: var(--terracota);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
  }
  .vacio {
    color: #8A6F55;
    font-family: 'Source Serif 4', serif;
    font-size: 13.5px;
    line-height: 1.6;
  }
  .vacio .estrella-ejemplo {
    color: var(--dorado);
    font-size: 15px;
  }

  .lista-favoritos {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .tarjeta-favorito {
    background: linear-gradient(160deg, #fff 0%, var(--papiro) 100%);
    border-radius: 6px 20px 6px 20px;
    overflow: hidden;
    box-shadow: 0 6px 16px rgba(61,31,62,0.15);
    border-bottom: 3px solid var(--dorado);
    display: flex;
    cursor: pointer;
  }

  .tarjeta-favorito .cuerpo {
    padding: 10px 12px 10px 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    flex: 1 1 auto;
  }

  .tarjeta-favorito .referencia {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--ciruela);
  }

  .tarjeta-favorito .fragmento {
    font-size: 11.5px;
    color: #6B5842;
    line-height: 1.4;
    margin-top: 3px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .tarjeta-favorito .btn-quitar {
    flex: 0 0 auto;
    width: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dorado);
    font-size: 20px;
    cursor: pointer;
    border-left: 1px solid rgba(61,31,62,0.08);
  }
  .tarjeta-favorito .btn-quitar:active { color: var(--terracota); }

  nav {
    flex: 0 0 auto;
    background: var(--ciruela);
    display: flex;
    justify-content: space-around;
    padding: 12px 0 max(14px, env(safe-area-inset-bottom));
    border-top: 2px solid var(--dorado);
  }
  nav .item {
    text-align: center;
    color: #C9A8C0;
    font-size: 10.5px;
    font-family: 'Cinzel', serif;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    text-decoration: none;
  }
  nav .item.activo { color: var(--dorado-brillante); text-shadow: 0 0 8px rgba(255,221,138,0.6); }
  .icono-nav {
    width: 26px; height: 26px;
    margin: 0 auto 4px;
    background-size: cover;
    background-position: center;
    mix-blend-mode: screen;
    filter: brightness(1.15);
  }
  .item.activo .icono-nav { filter: brightness(1.4); }
  #nav-inicio { background-image: url('nav-inicio.png'); }
  #nav-leer { background-image: url('nav-leer.png'); }
  #nav-guia { background-image: url('nav-guia.png'); }
  #nav-favoritos { background-image: url('nav-favoritos.png'); }

  .espacio-publicidad {
    flex: 0 0 auto;
    margin: 0 5vw 1vh;
    position: relative;
    background: linear-gradient(160deg, var(--papiro) 0%, #F0E2C2 100%);
    border: 1px solid rgba(61, 31, 62, 0.18);
    border-radius: 4px 14px 4px 14px;
    padding: 1.1vh 3.5vw 1vh;
    min-height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .espacio-publicidad::before,
  .espacio-publicidad::after {
    content: '';
    position: absolute;
    top: 3px; bottom: 3px;
    width: 2px;
    background: repeating-linear-gradient(180deg, var(--dorado) 0 4px, transparent 4px 8px);
  }
  .espacio-publicidad::before { left: 3px; }
  .espacio-publicidad::after { right: 3px; }

  .etiqueta-ads {
    position: absolute;
    top: -1px;
    left: 14px;
    background: var(--ciruela);
    color: var(--dorado-brillante);
    font-family: 'JetBrains Mono', monospace;
    font-size: 7.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 0 0 4px 4px;
  }

  .contenido-ads {
    text-align: center;
  }
  .contenido-ads .marcador {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--terracota);
    letter-spacing: 0.5px;
  }
  .contenido-ads .marcador-sub {
    font-size: 9px;
    color: #8A6F55;
    font-style: italic;
    margin-top: 1px;
  }
</style>
</head>
<body>
  <div class="phone">
    <header>
      <div class="btn-atras" id="btn-atras"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></div>
      <div>
        <div id="titulo-header">Favoritos</div>
        <div id="subtitulo-header">Versículos guardados</div>
      </div>
    </header>

    <main id="main">
      <div class="cargando">Cargando favoritos…</div>
    </main>

    <div class="espacio-publicidad" id="espacio-publicidad">
      <span class="etiqueta-ads">Publicidad</span>
      <div class="contenido-ads">
        <div class="marcador">✦ Aquí aparecerá un anuncio ✦</div>
        <div class="marcador-sub">Espacio reservado</div>
      </div>
    </div>

    <nav>
      <a class="item" href="index.html"><div class="icono-nav" id="nav-inicio"></div>Inicio</a>
      <a class="item" href="leer.html"><div class="icono-nav" id="nav-leer"></div>Leer</a>
      <a class="item" href="mapas.html"><div class="icono-nav" id="nav-guia"></div>Guía</a>
      <a class="item activo" href="favoritos.html"><div class="icono-nav" id="nav-favoritos"></div>Favoritos</a>
    </nav>
  </div>

<script>
  const main = document.getElementById('main');
  const btnAtras = document.getElementById('btn-atras');

  function obtenerFavoritos() {
    try {
      const datos = JSON.parse(localStorage.getItem('favoritosVersos'));
      return Array.isArray(datos) ? datos : [];
    } catch (e) { return []; }
  }

  function guardarFavoritos(lista) {
    try { localStorage.setItem('favoritosVersos', JSON.stringify(lista)); } catch (e) {}
  }

  function quitarFavorito(libro, capitulo, verso) {
    let favoritos = obtenerFavoritos();
    favoritos = favoritos.filter(f => !(f.libro === libro && f.capitulo === capitulo && f.verso === verso));
    guardarFavoritos(favoritos);
    mostrarLista();
  }

  function irAVerso(libro, capitulo, verso) {
    window.location.href = `leer.html?libro=${encodeURIComponent(libro)}&capitulo=${capitulo}&verso=${verso}&desde=favoritos`;
  }

  function mostrarLista() {
    const favoritos = obtenerFavoritos().slice().sort((a, b) => (b.fecha || 0) - (a.fecha || 0));

    if (favoritos.length === 0) {
      main.innerHTML = `
        <div class="vacio">
          Todavía no tienes versículos guardados.<br><br>
          Mientras lees, toca la estrella <span class="estrella-ejemplo">☆</span> junto a cualquier versículo para guardarlo aquí.
        </div>
      `;
      return;
    }

    main.innerHTML = `
      <div class="lista-favoritos">
        ${favoritos.map(f => `
          <div class="tarjeta-favorito">
            <div class="cuerpo" onclick="irAVerso('${f.libro}', ${f.capitulo}, ${f.verso})">
              <div class="referencia">${f.nombreLibro} ${f.capitulo}:${f.verso}</div>
              <div class="fragmento">${f.texto}</div>
            </div>
            <div class="btn-quitar" onclick="quitarFavorito('${f.libro}', ${f.capitulo}, ${f.verso})">★</div>
          </div>
        `).join('')}
      </div>
    `;
    main.scrollTop = 0;
  }

  btnAtras.addEventListener('click', () => {
    window.location.href = 'index.html';
  });

  mostrarLista();
</script>
</body>
</html>
